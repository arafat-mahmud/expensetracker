name: expensetracker
description: "Expense Tracker - A personal daily expense tracker with modern dashboard."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_localization: ^0.3.3

  # State Management
  provider: ^6.1.5+1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^1.1.1

  # Date Formatting
  intl: ^0.20.2

  # Path Provider for Hive
  path_provider: ^2.1.5

  # Firebase & Authentication
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: 6.3.0
  cloud_firestore: ^6.1.0

  # PDF Generation & CSV Export
  pdf: ^3.11.3
  printing: ^5.13.2
  csv: ^6.0.0
  share_plus: ^12.0.1
  open_file: ^3.3.2
  permission_handler: ^12.0.1

  # Google Fonts
  google_fonts: ^6.3.2

  # URL Launcher and Package Info
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Hive Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/expensetracker.png
    - assets/loginicon.png

  # Fonts
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/expensetracker.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/expensetracker.png"
